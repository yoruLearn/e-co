worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    log_format json_escape escape=json
        '{"ts":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"rt":$request_time,"upstream_rt":"$upstream_response_time",'
        '"trace_id":"$http_x_trace_id"}';

    access_log /var/log/nginx/access.log json_escape;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 探针不记访问日志，避免噪音
        location = /healthz {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            access_log off;
        }

        location = /readyz {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            access_log off;
        }

        # SSE：必须关闭缓冲、长读超时，否则 token 会被攒住（Spec §2.1 / §15 流式兼容）
        location = /api/v1/chat/stream {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Trace-Id $http_x_trace_id;
            proxy_set_header X-Session-Id $http_x_session_id;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Trace-Id $http_x_trace_id;
            proxy_set_header X-Session-Id $http_x_session_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
