global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: dev
    service: aftersales-agent

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: aftersales-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
