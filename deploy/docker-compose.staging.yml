# staging 叠加文件：与基础 compose 同拓扑，只改生产化参数。
# 用法：docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.staging.yml up -d
services:
  api:
    environment:
      APP_ENV: staging
      LOG_FORMAT: json
      RELEASE_CHANNEL: staging
      # staging 必须关掉 dev 登录；用真实 JWT/网关注入
      DEV_LOGIN_ENABLED: "false"
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "2.0", memory: 2G}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    environment:
      APP_ENV: staging
      MQ_ENABLED: "true"
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "1.0", memory: 1G}

  nginx:
    deploy:
      replicas: 2

  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=28d

  grafana:
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"

  # staging 数据保留：MySQL 每日全备 + binlog 7 天（脚本见 scripts/backup.ps1）
