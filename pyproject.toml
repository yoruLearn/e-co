[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aftersales-agent"
version = "0.1.0"
description = "电商售后管家 · 对话式售后 Agent（FastAPI + LangGraph + RAG）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "aftersales-platform" }]
dependencies = [
  "fastapi>=0.115,<0.140",
  "uvicorn[standard]>=0.32,<0.40",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "aiomysql>=0.2.0,<0.3",
  "alembic>=1.14,<2",
  "redis>=5.2,<8",
  "prometheus-client>=0.21,<1",
  "PyJWT>=2.10,<3",
  "orjson>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-PyMySQL>=1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "integration: 需要真实依赖（docker compose 起的 MySQL/Redis/MQ/Chroma）",
  "e2e: 端到端对话流（M2 起启用）",
  "contract: Spec 表格与代码常量一致性守护",
]
filterwarnings = [
  "error::DeprecationWarning:app.*",
  "ignore::DeprecationWarning:aiomysql.*",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/migrations/*", "app/*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "app/migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF", "S", "ANN", "ARG", "T20",
]
ignore = [
  "ANN401",   # Any 在依赖注入签名中可接受
  "RUF001",   # 全角标点出现在中文文案里属预期
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "ARG", "S105", "S106", "PLR2004"]
"app/migrations/env.py" = ["ANN", "E402", "T20"]
"app/api/routers/*.py" = ["ARG001"]   # M0 契约占位：参数由框架注入，实现留待 M1/M2
"scripts/**" = ["ANN", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
packages = ["app"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
disallow_any_unimported = false
show_error_codes = true
exclude = ["app/migrations/versions/.*"]
plugins = []

[[tool.mypy.overrides]]
module = ["aiomysql.*", "pymysql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.migrations.*"]
strict = false
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
strict = false
ignore_errors = true
