name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: lint / type / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"
          enable-cache: true

      - name: install python + deps
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv sync --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app

      - name: pytest + coverage gate
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: process smoke（探针 / metrics / trace）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"
          enable-cache: true
      - run: uv sync --extra dev
      # 不依赖 MySQL/Redis：缺依赖时 /readyz 必须 503 且给出逐项明细
      - run: uv run python scripts/smoke.py

  compose:
    name: compose config + image build + trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compose config
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q

      - name: build api image
        run: docker build -f deploy/Dockerfile -t aftersales-agent:ci .

      # 容器级冒烟：/healthz 按设计不依赖任何外部组件，因此无需 MySQL/Redis 即可验证
      # ENTRYPOINT、非 root 用户、HEALTHCHECK 与端口暴露是否正确。
      - name: run container and probe /healthz
        run: |
          set -euo pipefail
          docker run -d --name api-smoke -p 18000:8000 \
            -e APP_ENV=dev -e LOG_FORMAT=json -e SHUTDOWN_DRAIN_SECONDS=0 \
            aftersales-agent:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18000/healthz; then
              echo
              docker exec api-smoke python -m app.workers.runner --once
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy, logs:"
          docker logs api-smoke
          exit 1

      - name: stop smoke container
        if: always()
        run: docker rm -f api-smoke || true

      - name: trivy scan（CRITICAL 阻断，忽略未修复）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aftersales-agent:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  migration:
    name: alembic upgrade / downgrade（MySQL 8.0）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aftersales
          MYSQL_USER: aftersales
          MYSQL_PASSWORD: aftersales
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: dev
      DATABASE_URL: mysql+aiomysql://aftersales:aftersales@127.0.0.1:3306/aftersales?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"
          enable-cache: true
      - run: uv sync --extra dev

      - name: upgrade head
        run: uv run alembic upgrade head

      - name: verify 9 tables exist
        run: |
          uv run python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from app.common.clients import build_clients
          from app.common.config import get_settings
          from app.db.models import ALL_TABLES

          async def main() -> None:
              clients = build_clients(get_settings())
              async with clients.engine.connect() as conn:
                  rows = await conn.execute(text("SHOW TABLES"))
                  tables = {row[0] for row in rows}
                  index_rows = await conn.execute(
                      text("SHOW INDEX FROM rag_chunk WHERE Key_name = 'ft_rag_chunk'")
                  )
                  fulltext = [row for row in index_rows.fetchall()]
              await clients.aclose()
              missing = set(ALL_TABLES) - tables
              assert not missing, f"缺少表: {missing}"
              assert fulltext, "rag_chunk 缺少 FULLTEXT(ngram) 索引，中文关键词通道不可用"
              print(f"tables ok: {len(tables)} | fulltext index columns: {len(fulltext)}")

          asyncio.run(main())
          PY

      - name: downgrade base（可回退性）
        run: uv run alembic downgrade base

  rag-integration:
    name: RAG 端到端（MySQL 8 + Chroma）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aftersales
          MYSQL_USER: aftersales
          MYSQL_PASSWORD: aftersales
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      chroma:
        image: chromadb/chroma:0.5.20
        env:
          IS_PERSISTENT: "FALSE"
          ANONYMIZED_TELEMETRY: "FALSE"
        ports: ["8100:8000"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=6
    env:
      APP_ENV: dev
      DATABASE_URL: mysql+aiomysql://aftersales:aftersales@127.0.0.1:3306/aftersales?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      CHROMA_URL: http://127.0.0.1:8100
      # CI 不下载 100MB 本地模型：hash 向量只为连通性验证，检索质量由本地/评测集负责
      EMBEDDING_PROVIDER: hash
      EMBEDDING_DIM: "256"
      KEYWORD_BACKEND: mysql
      LLM_PROVIDER: mock
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"
          enable-cache: true
      - run: uv sync --extra dev

      - name: migrate
        run: uv run alembic upgrade head

      # 建索引 → 校验条数/版本 → 混合召回 → 关键词单通道 → Prompt Registry（DB 源）
      - name: rag smoke
        run: uv run python scripts/rag_smoke.py --version v1

      # Redis checkpointer：跨实例恢复（Spec §6.2 第 5 条 / FR-AS-06）
      - name: redis checkpoint
        run: uv run pytest tests/integration/test_checkpoint_redis.py -q -m integration_redis
